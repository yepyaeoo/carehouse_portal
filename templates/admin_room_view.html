<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>職員用 - {{ room_number }}号室 管理モニター</title>
    <style>
        body { font-family: "Meiryo", sans-serif; background-color: #f4f7f6; color: #2c3e50; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .admin-box { width: 100%; max-width: 750px; margin-top: 10px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 3px solid #cbdccb; padding-bottom: 15px; }
        h1 { color: #27ae60; margin: 0; font-size: 1.6rem; display: flex; align-items: center; gap: 8px; }
        .btn-back { background: white; border: 3px solid #7f8c8d; border-radius: 10px; padding: 8px 16px; font-weight: bold; text-decoration: none; color: #555; transition: background 0.15s; }
        .btn-back:hover { background: #eee; }
        
        .profile-card { background: #ffffff; border: 3px solid #cbdccb; border-radius: 14px; padding: 20px; margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; }
        .profile-info { font-size: 1.1rem; }
        .btn-edit { background: #e67e22; color: white; border: none; border-radius: 8px; padding: 10px 16px; font-weight: bold; text-decoration: none; font-size: 0.95rem; transition: background 0.15s; }
        .btn-edit:hover { background: #d35400; }
        
        /* Layout Grids */
        .grid-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        .grid-vitals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 25px; }
        @media(max-width: 550px) {
            .grid-actions { grid-template-columns: 1fr; }
            .grid-vitals { grid-template-columns: 1fr; }
        }
        
        /* Card Styles */
        .vital-card { background: white; border: 3px solid #cbdccb; border-radius: 16px; padding: 25px 15px; text-align: center; }
        .vital-title { font-size: 1rem; font-weight: bold; color: #7f8c8d; margin-bottom: 8px; }
        .vital-value { font-size: 2.2rem; font-weight: bold; color: #2c3e50; }
        .unit { font-size: 1rem; font-weight: normal; margin-left: 3px; }
        
        .action-card { background: white; border: 3px solid #2f80ed; border-radius: 14px; padding: 20px 15px; text-decoration: none; color: #2f80ed; font-weight: bold; font-size: 1.05rem; text-align: center; display: flex; align-items: center; justify-content: center; gap: 8px; transition: background 0.15s; }
        .action-card:hover { background: #f0f6ff; }
        
        .history-btn { display: flex; align-items: center; justify-content: center; gap: 10px; background: white; border: 3px solid #27ae60; border-radius: 14px; padding: 20px; text-decoration: none; font-weight: bold; color: #27ae60; font-size: 1.1rem; text-align: center; transition: background 0.15s; }
        .history-btn:hover { background: #eaf6ee; }
        .chart-icon { width: 24px; height: 24px; fill: #27ae60; }
        
        .staff-badge { background: #27ae60; color: white; font-size: 0.8rem; padding: 3px 8px; border-radius: 6px; margin-right: 5px; vertical-align: middle; }
    </style>
</head>
<body>
    <div class="admin-box">
        <div class="header">
            <h1><span class="staff-badge">職員専用</span> {{ room_number }}号室 状態監視モニター</h1>
            <!-- Pointed safely to your central staff control cockpit dashboard -->
            <a href="/admin/dashboard" class="btn-back">ダッシュボードへ戻る</a>
        </div>
        
        <div class="profile-card">
            <div class="profile-info">
                入居者氏名: <strong style="color:#27ae60; font-size: 1.3rem;">{{ data.name }} 様</strong> 
                <span style="color:#7f8c8d; margin-left: 10px;">({{ data.age }}歳)</span>
            </div>
            <!-- Button 1: Connected directly to your backend patient/room management routing -->
            <a href="/admin/patients" class="btn-edit">🏢 名簿・部屋割編集</a>
        </div>
        
        <div class="grid-vitals">
            <div class="vital-card" style="border-color: #e74c3c;">
                <div class="vital-title">❤️ 心拍レート</div>
                <div class="vital-value" style="color: #e74c3c;">{{ data.bpm }}<span class="unit">bpm</span></div>
            </div>
            <div class="vital-card">
                <div class="vital-title">🌡️ 室内温度</div>
                <div class="vital-value" style="color: #e67e22;">{{ data.temp }}<span class="unit">°C</span></div>
            </div>
            <div class="vital-card">
                <div class="vital-title">💧 室内湿度</div>
                <div class="vital-value" style="color: #2980b9;">{{ data.humidity }}<span class="unit">%</span></div>
            </div>
        </div>

        <div class="grid-actions">
            <!-- Button 2: Linked directly to communication dispatch page -->
            <a href="/admin/communication" class="action-card">
                ✉️ 新規お知らせ・質問を送る
            </a>
            <!-- Button 3: Linked directly to the survey/notice tracking summary system -->
            <a href="/admin/communication" class="action-card" style="border-color: #8e44ad; color: #8e44ad;">
                📋 この部屋の回答状況を確認
            </a>
        </div>
        
        <a href="/room/{{ room_number }}/history" class="history-btn">
            <svg class="chart-icon" viewBox="0 0 24 24">
                <path d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6h-6z"/>
            </svg>
            <span>バイオメトリクス・環境ログ過去履歴（グラフ表示）</span>
        </a>
    </div>
</body>
</html>
