{% extends "base.html" %}
{% block content %}

<h1>Send message</h1>

<div class="card">
  <form method="POST">
    <label>Patient</label>
    <select name="recipient_id" required>
      <option value="">-- Select patient --</option>
      {% for patient in patients %}
        <option value="{{ patient.id }}">
          {{ patient.profile.name if patient.profile else patient.username }}
        </option>
      {% endfor %}
    </select>

    <label>Subject</label>
    <input type="text" name="subject" placeholder="e.g. Medication update" required>

    <label>Message</label>
    <textarea name="body" placeholder="Write your message here..." required></textarea>

    <button class="btn" type="submit">&#128140; Send message</button>
  </form>
</div>

<a href="{{ url_for('admin.dashboard') }}" class="btn btn-gray">
  &#8592; Back to dashboard
</a>

{% endblock %}
