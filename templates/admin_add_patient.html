{% extends "base.html" %}
{% block content %}

<h1>Add new patient</h1>

<div class="card">
  <form method="POST">
    <label>Username</label>
    <input type="text" name="username" required placeholder="e.g. user6">

    <label>Password</label>
    <input type="password" name="password" required placeholder="Set a password">

    <label>Full name</label>
    <input type="text" name="name" required placeholder="e.g. Suzuki Taro">

    <label>Age</label>
    <input type="number" name="age" required min="1" max="120">

    <label>Weight (kg)</label>
    <input type="number" name="weight" required step="0.1" min="1">

    <label>Height (cm)</label>
    <input type="number" name="height" required step="0.1" min="1">

    <label>Blood pressure</label>
    <input type="text" name="blood_pressure" placeholder="e.g. 120/80">

    <button class="btn" type="submit">&#43; Add patient</button>
  </form>
</div>

<a href="{{ url_for('admin.patients') }}" class="btn btn-gray">
  &#8592; Back to patients
</a>

{% endblock %}
