<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>みまもりシステム - ホーム</title>
    <style>
        body {
            font-family: "Meiryo", "MS PGothic", sans-serif;
            background-color: #f2f9f5;
            color: #1c2d24;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
        }
        .portal-container {
            width: 100%;
            max-width: 600px;
            text-align: center;
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.05);
            border: 3px solid #cbdccb;
        }
        h1 {
            font-size: 2.2rem;
            color: #27ae60;
            margin-bottom: 10px;
        }
        p {
            font-size: 1.2rem;
            color: #555;
            margin-bottom: 40px;
        }
        .portal-options {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .portal-button {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #ffffff;
            border: 3px solid #27ae60;
            border-radius: 16px;
            padding: 25px 30px;
            text-decoration: none;
            color: #1c2d24;
            transition: all 0.2s ease;
        }
        .portal-button:hover {
            background-color: #eaf6ee;
            transform: translateY(-2px);
        }
        .button-text {
            text-align: left;
        }
        .button-title {
            font-size: 1.8rem;
            font-weight: bold;
            color: #27ae60;
        }
        .button-desc {
            font-size: 1rem;
            color: #666;
            margin-top: 5px;
        }
        .icon {
            width: 50px;
            height: 50px;
            fill: #27ae60;
        }
    </style>
</head>
<body>
    <div class="portal-container">
        <h1>施設環境 みまもりシステム</h1>
        <p>ご利用になるボタンを選択してください</p>
        
        <div class="portal-options">
            <!-- Both portals lead to the room choice interface index -->
            <a href="/rooms" class="portal-button">
                <div class="button-text">
                    <div class="button-title">職員・スタッフの方</div>
                    <div class="button-desc">お部屋の環境確認と管理画面へ移動します</div>
                </div>
                <svg class="icon" viewBox="0 0 24 24">
                    <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 3c1.93 0 3.5 1.57 3.5 3.5S13.93 13 12 13s-3.5-1.57-3.5-3.5S10.07 6 12 6zm0 12c-2.69 0-5.04-1.39-6.32-3.5.03-2.09 4.22-3.25 6.32-3.25 2.09 0 6.29 1.16 6.33 3.25C17.04 16.61 14.69 18 12 18z"/>
                </svg>
            </a>

            <a href="/rooms" class="portal-button">
                <div class="button-text">
                    <div class="button-title">入居者・ご家族の方</div>
                    <div class="button-desc">お部屋の現在の様子を確認します</div>
                </div>
                <svg class="icon" viewBox="0 0 24 24">
                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
            </a>
        </div>
    </div>
</body>
</html>
