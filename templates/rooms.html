<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>みまもりシステム - お部屋の選択</title>
    <style>
        body { font-family: "Meiryo", sans-serif; background-color: #f2f9f5; color: #1c2d24; margin: 0; padding: 15px; display: flex; justify-content: center; }
        .directory-container { width: 100%; max-width: 760px; margin-top: 20px; }
        .navigation-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 35px; }
        .page-title { font-size: 1.8rem; font-weight: bold; margin: 0; color: #27ae60; }
        .back-menu-button { display: inline-flex; align-items: center; background-color: #ffffff; border: 3px solid #27ae60; border-radius: 12px; padding: 10px 20px; font-size: 1.1rem; font-weight: bold; color: #27ae60; text-decoration: none; transition: all 0.2s; }
        .back-menu-button:hover { background-color: #eaf6ee; }
        .room-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        @media(max-width: 600px){ .room-grid { grid-template-columns: repeat(2, 1fr); } }
        .room-card { background: #ffffff; border: 3px solid #cbdccb; border-radius: 16px; padding: 25px 15px; text-align: center; text-decoration: none; color: #1c2d24; display: flex; flex-direction: column; align-items: center; gap: 12px; transition: all 0.2s ease; }
        .room-active { border-color: #27ae60; background-color: #ffffff; }
        .room-active:hover { background-color: #eaf6ee; transform: translateY(-3px); box-shadow: 0 6px 12px rgba(39,174,96,0.15); }
        .room-disabled { background-color: #e8ebe9; border-color: #bdc3c7; color: #1c2d24; }
        .room-disabled:hover { background-color: #e1e5e3; transform: translateY(-3px); }
        .room-number { font-size: 1.8rem; font-weight: bold; }
        .room-status { font-size: 1rem; font-weight: bold; padding: 4px 12px; border-radius: 20px; }
        .status-active { background-color: #27ae60; color: white; }
        .status-empty { background-color: #bdc3c7; color: #ffffff; }
        .bed-icon { width: 60px; height: 60px; fill: currentColor; }
    </style>
</head>
<body>
    <div class="directory-container">
        <div class="navigation-bar">
            <div class="page-title">部屋を確認</div>
            <a href="/admin/dashboard" class="back-menu-button">メニューに戻る</a>
        </div>

        <div class="room-grid">
            {% for r_num in range(401, 410) %}
                {% set r_name = "" ~ r_num ~ "号室" %}
                {% set active_count = room_data.get(r_name, 0) %}
                
                {% if r_num == 403 %}
                    <a href="/room/403" class="room-card room-active">
                        <svg class="bed-icon" style="color: #27ae60;" viewBox="0 0 24 24"><path d="M7 13v-2h14v2H7zm0 4v-2h14v2H7zm14-8H3V5H1v15h2v-2h18v2h2v-9c0-1.66-1.34-3-3-3zm-11 1H3V7h7v3z"/></svg>
                        <div class="room-number">{{ r_num }}号室</div>
                        <div class="room-status status-active">みまもり中</div>
                    </a>
                {% else %}
                    <a href="/room/{{ r_num }}" class="room-card room-disabled">
                        <svg class="bed-icon" style="color: #7f8c8d;" viewBox="0 0 24 24"><path d="M7 13v-2h14v2H7zm0 4v-2h14v2H7zm14-8H3V5H1v15h2v-2h18v2h2v-9c0-1.66-1.34-3-3-3zm-11 1H3V7h7v3z"/></svg>
                        <div class="room-number">{{ r_num }}号室</div>
                        {% if active_count > 0 %}
                            <div class="room-status status-active" style="background-color: #2980b9;">入居中</div>
                        {% else %}
                            <div class="room-status status-empty">空き部屋</div>
                        {% endif %}
                    </a>
                {% endif %}
            {% endfor %}
        </div>
    </div>
</body>
</html>
