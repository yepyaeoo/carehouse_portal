{% extends "base.html" %}
{% block content %}

<div style="text-align:center; padding: 40px 0;">
  <h1 style="margin-bottom:10px;">Medicine Reminder</h1>
  <p style="color:#666; margin-bottom:48px;">Who are you logging in as?</p>

  <div style="display:flex; justify-content:center; gap:40px; flex-wrap:wrap;">

    <a href="{{ url_for('auth.login_page', role='admin') }}"
       style="text-decoration:none; color:inherit;">
      <div style="width:200px; padding:40px 20px; border:2px solid #2d9e6b;
                  border-radius:16px; cursor:pointer; background:white;
                  transition: background 0.2s;">
        <div style="font-size:64px; margin-bottom:16px;">&#128101;</div>
        <div style="font-size:20px; font-weight:bold; color:#2d9e6b;">Admin</div>
        <div style="font-size:14px; color:#888; margin-top:6px;">Manage patients & medicines</div>
      </div>
    </a>

    <a href="{{ url_for('auth.login_page', role='patient') }}"
       style="text-decoration:none; color:inherit;">
      <div style="width:200px; padding:40px 20px; border:2px solid #2d9e6b;
                  border-radius:16px; cursor:pointer; background:white;
                  transition: background 0.2s;">
        <div style="font-size:64px; margin-bottom:16px;">&#128116;</div>
        <div style="font-size:20px; font-weight:bold; color:#2d9e6b;">Patient</div>
        <div style="font-size:14px; color:#888; margin-top:6px;">View your schedule</div>
      </div>
    </a>

  </div>
</div>

{% endblock %}
